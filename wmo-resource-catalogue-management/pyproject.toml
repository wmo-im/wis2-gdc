[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wmo-resource-catalogue"
version = "0.10.dev0"
description = "wmo-resource-catalogue is a Reference Implementation of a WIS2 Global Discovery Catalogue and WIGOS Global Station Catalogue"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
keywords = ["world meteorological organization", "resource catalogue", "wmo information system", "wis2", "global discovery catalogue", "gdc", "wmo core metadata profile", "wcmp2", "discovery metadata", "wmo integrated global observing system", "wigos", "gsc", "global station catalogue", "gsc", "wigos metadata record", "wmdr2", "station metadata"]
authors = [
    {name = "Tom Kralidis", email = "tomkralidis@gmail.com"}
]
maintainers = [
    {name = "Tom Kralidis", email = "tomkralidis@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: GIS"
]
dependencies = [
    "click",
    "pywcmp",
    "pywis-pubsub",
    "pywiscat",
    "redis[hiredis]",
    "requests",
    "unicodecsv"
]

[project.optional-dependencies]
backend = ["elasticsearch<9", "OWSLib"]
dev = ["flake8"]
docs = ["sphinx"]
release = ["build", "twine", "wheel"]

[project.scripts]
wmo-resource-catalogue = "wmo_resource_catalogue:cli"

[project.urls]
homepage = "https://github.com/wmo-im/wmo-resource-catalogue"
source = "https://github.com/wmo-im/wmo-resource-catalogue"
documentation = "https://wmo-im.github.io/wmo-resource-catalogue"
issues = "https://github.com/wmo-im/wmo-resource-catalogue/issues"

[tool.setuptools.package-data]
"wmo_resource_catalogue.resources" = ["*.json"]

[tool.setuptools.packages.find]
#where = ["*"]
#include = ["*"]
exclude = [
    "docker"
]
